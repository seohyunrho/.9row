<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아 · 제출 감지 시험</title><link rel="icon" href="/favicon.svg"><style>body{margin:0;background:#f4f7ed;color:#3f5435;font-family:'Malgun Gothic',sans-serif;line-height:1.8}main{max-width:760px;margin:40px auto;padding:30px;background:#fffefb;border:1px solid #dfe6d3;border-radius:16px}h1{font-size:25px}small{color:#8b987b}label{display:block;margin:14px 0}input,textarea,select{box-sizing:border-box;display:block;width:100%;padding:12px;border:1px solid #d0dcc0;border-radius:7px;font:inherit}textarea{min-height:90px}button,a{display:inline-block;padding:11px 17px;border-radius:7px;border:1px solid #c6d4b5;background:#eff4e7;color:#4d693d;cursor:pointer;font:inherit;text-decoration:none;margin:5px 5px 5px 0}.notice{padding:16px;background:#f0f3e7;border-radius:8px}.buttons{margin:20px 0}#application-status{padding:17px;border:1px dashed #b9c8a6;border-radius:8px}#event-id{font-size:11px}#bridge-result{font-size:13px;color:#8b704c}@media(max-width:780px){main{margin:15px;padding:20px}}</style></head><body><main><small>가상 지원 · 실제 기업으로 전송되지 않습니다.</small><h1>제출 결과 감지 시험</h1><p class="notice">성공·실패·확인 필요 상태가 다르게 기록되는지 확인하는 전용 페이지입니다. 실제 자소설닷컴 연결 시험은 아닙니다.</p><p><strong data-moa-company>모아 시험회사</strong> · <span data-moa-role>서비스 기획</span></p><label>이름<input id="test-name" autocomplete="off"></label><label>이메일<input id="test-email" type="email" autocomplete="off"></label><label>시험용 자소서<textarea id="test-essay">이 본문은 지원 기록으로 수집되면 안 됩니다. PRIVATE_ESSAY_TEST_MARKER</textarea></label><label>이번 제출의 모의 결과<select id="scenario"><option value="confirmed">접수 성공</option><option value="failed">필수 정보 오류로 실패</option><option value="unknown">결과를 확인할 수 없음</option></select></label><div class="buttons"><button id="submit">최종 제출 시험</button><button id="new-event">새 시험 시작</button></div><p id="application-status" data-state="idle">아직 제출하지 않았어요.</p><small>같은 시험은 여러 번 저장해도 한 건으로 유지됩니다.</small><div id="event-id"></div><hr><h2>확장 설치 전 저장 흐름 확인</h2><p>아래 버튼은 현재 모의 결과의 회사·직무·지원일만 샘플 사무실로 보냅니다. 확장 프로그램 설치 검증을 대신하지 않습니다.</p><button id="bridge">현재 시험 결과 기록하기</button><p id="bridge-result" role="status"></p><a href="/#applications">사무실 지원 현황 보기</a><script type="module" src="/fixture.js"></script></main></body></html>

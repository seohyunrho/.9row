<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아 · 기본 정보 입력 시험</title><link rel="icon" href="/favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ed;color:#303630;font:15px/1.7 'Malgun Gothic',sans-serif}header{padding:22px 30px;background:#eae4d6;border-bottom:1px solid #cfc4b0}h1{font-size:24px;margin:0}p{margin:6px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 442px;max-width:1300px;margin:auto;gap:22px;padding:24px}.form{padding:24px;background:white;border:1px solid #d8d8ce}fieldset{border:1px solid #d8d8ce;margin:18px 0;padding:18px}legend{font-weight:bold}label{display:block;font-size:13px;margin:10px 0}input,textarea,select{width:100%;padding:9px;border:1px solid #bfc6bb;font:inherit;border-radius:3px}button{padding:10px 16px;background:#4c6545;color:white;border:0;font:inherit;cursor:pointer;margin:8px 8px 8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}textarea{min-height:80px}iframe{width:442px;height:1000px;border:1px solid #cfc4b0;background:#fffefa;position:sticky;top:12px}.muted{font-size:13px;color:#666}#qa-result{white-space:pre-wrap;font-size:13px}#submission-count{font-weight:bold}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:12px}.grid{grid-template-columns:1fr}iframe{position:static;max-width:100%;height:900px}}
</style></head><body><header><h1>지원서 기본 정보 · 안전한 시험 화면</h1><p>현대오토에버의 실제 지원서가 아닌 가상 입력 양식입니다. 오른쪽은 확장 설치 전 미리보기입니다.</p><p class="muted">실제 개인정보·로그인·외부 전송 없이 입력 동작을 확인합니다. Chrome 설치 검증은 별도입니다.</p></header>
<div class="layout"><main class="form"><form id="application"><fieldset><legend>학력 · 일반 입력란</legend><div class="grid">
<label>학교명<input id="school"></label><label>소재지<input id="location"></label><label>전공<input id="major"></label><label>복수전공<input id="doubleMajor"></label>
<label>학점<input id="gpa" type="number" step="0.01" min="0" max="4.5"></label><label>만점<input id="gpaScale" type="number" step="0.1"></label><label>총 이수 학점<input id="credits" type="number" min="0" max="300"></label><label>입학 연월<input id="start" type="month"></label>
<label>학위<select id="degree"><option value="">선택해 주세요</option><option value="bachelor">학사</option><option value="master">석사</option></select></label><label>학교 검색<input id="schoolSearch" role="combobox" aria-autocomplete="list" placeholder="검색 후 결과에서 선택"></label>
</div></fieldset><fieldset><legend>자격증</legend><div class="grid"><label>자격증 이름<input id="certName"></label><label>발급기관<input id="issuer"></label><label>취득일<input id="acquired" type="date"></label><label>자격증 번호<input id="certNo"></label></div></fieldset>
<fieldset><legend>보호할 기존 내용</legend><label>부전공<input id="existing" value="기존에 작성한 전공"></label><label>이름<input id="person" value="가상 지원자"></label><label>자기소개서<textarea id="essay">PRIVATE_ESSAY_TEST_MARKER · 이 글은 읽거나 바뀌면 안 됩니다.</textarea></label><label><input type="checkbox" id="consent" style="width:auto">동의 항목도 자동 선택하지 않습니다.</label></fieldset>
<button type="submit">최종 제출 모의 버튼</button><p id="submission-count">제출 버튼 실행: 0회</p></form>
<hr><h2>개발 확인</h2><button id="reset" type="button">가상 양식 초기화</button><button id="qa" type="button">입력 보호 검사 실행</button><p class="muted">검사는 가상 입력란만 잠깐 바꾸고 초기화합니다.</p><div id="qa-result" role="status"></div></main><aside><iframe title="확장 프로그램 화면 미리보기" src="/autofill-preview/popup.html"></iframe></aside></div><script type="module" src="/autofill-fixture.js"></script><script type="module" src="/education-fixture.js"></script></body></html>
